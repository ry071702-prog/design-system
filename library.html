<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>デザインライブラリ — 共通デザインシステム</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./tokens.css" />
<link rel="stylesheet" href="./app.css" />
<style>
  /* ライブラリ固有 (生値は使わず var(--*) のみ) */
  .filters { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center;
    margin-bottom: var(--space-5); }
  .tag-filter { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .tag-filter button {
    font: inherit; font-size: var(--text-xs); font-weight: 600; cursor: pointer;
    color: var(--fg-muted); background: var(--bg-sunken);
    border: 1px solid var(--border); border-radius: var(--radius-pill);
    padding: 0.25rem 0.7rem; transition: background var(--dur-fast), color var(--dur-fast); }
  .tag-filter button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: transparent; }

  .ref-grid { display: grid; gap: var(--space-4);
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .ref-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .ref-thumb { aspect-ratio: 16 / 9; background: var(--accent-grad);
    display: grid; place-items: center; position: relative; }
  .ref-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref-thumb .mono { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 700;
    color: var(--accent-fg); text-shadow: var(--accent-fg-shadow, none);
    letter-spacing: var(--tracking-wide); opacity: 0.92; padding: 0 var(--space-4); text-align: center; }
  .ref-body { padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2);
    flex: 1; }
  .ref-head { display: flex; align-items: flex-start; gap: var(--space-2); justify-content: space-between; }
  .ref-title { font-weight: 700; font-size: var(--text-base); color: var(--fg);
    text-decoration: none; line-height: var(--leading-snug); }
  .ref-title:hover { color: var(--accent); }
  .ref-good { font-size: var(--text-sm); color: var(--fg-muted); line-height: var(--leading-normal); margin: 0; }
  .ref-extract { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg-subtle);
    background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: var(--space-2); line-height: var(--leading-normal); }
  .ref-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: auto; padding-top: var(--space-2); }
  .ref-foot { display: flex; align-items: center; justify-content: space-between;
    font-size: var(--text-xs); color: var(--fg-subtle); font-family: var(--font-mono); }

  .empty { color: var(--fg-subtle); font-size: var(--text-sm); padding: var(--space-6);
    text-align: center; border: 1px dashed var(--border); border-radius: var(--radius-lg); }

  /* 追加フォーム */
  details.adder { margin-top: var(--space-7); }
  details.adder > summary { cursor: pointer; font-size: var(--text-sm); font-weight: 600;
    color: var(--accent); list-style: none; }
  details.adder > summary::-webkit-details-marker { display: none; }
  .field { display: block; margin-bottom: var(--space-3); }
  .field > span { display: block; font-size: var(--text-xs); font-weight: 600;
    letter-spacing: var(--tracking-label); text-transform: uppercase; color: var(--fg-subtle);
    margin-bottom: 0.35rem; }
  textarea.ds-input { resize: vertical; min-height: 3.2rem; font-family: inherit; }
  pre.snippet { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--fg);
    background: var(--bg-sunken); border: 1px solid var(--border); border-radius: var(--radius-md);
    padding: var(--space-3); overflow: auto; white-space: pre; line-height: var(--leading-normal); }
</style>
</head>
<body class="theme-studio" data-theme="light">
  <div class="wrap">
    <!-- topbar は app.js が注入 -->

    <section class="page-intro ds-animate-in">
      <p class="ds-kicker">Design Library</p>
      <h1 class="ds-title">世の中の良いデザインを、<br>どんどん貯めていく。</h1>
      <p class="lead">見つけた良いデザインを台帳に溜め、<code style="font-family:var(--font-mono)">tokens.css</code> へ還元していく場所。
        <b>inbox</b> は収集したて、<b>promoted</b> はトークンへ取り込み済み。データは
        <code style="font-family:var(--font-mono)">data/references.json</code> をあなたがキュレーションします。</p>
    </section>

    <section>
      <div class="filters">
        <div class="seg" id="status-seg" role="group" aria-label="ステータス絞り込み">
          <button data-status="all" aria-pressed="true">すべて</button>
          <button data-status="inbox" aria-pressed="false">Inbox</button>
          <button data-status="promoted" aria-pressed="false">Promoted</button>
        </div>
        <div class="tag-filter" id="tag-filter" aria-label="タグ絞り込み"></div>
      </div>

      <div class="ref-grid" id="ref-grid"></div>
      <div class="empty" id="empty" hidden>該当するデザインがありません。</div>
    </section>

    <details class="adder">
      <summary>＋ 新しいデザインを追加する (JSON 雛形を生成)</summary>
      <div class="ds-card" style="margin-top:var(--space-4)">
        <p style="margin-top:0;color:var(--fg-muted);font-size:var(--text-sm)">入力すると下に JSON エントリが出ます。コピーして
          <code style="font-family:var(--font-mono);color:var(--fg)">data/references.json</code> の <code style="font-family:var(--font-mono);color:var(--fg)">"references"</code> 配列に貼ってください。</p>
        <div class="grid grid-2">
          <label class="field"><span>タイトル</span><input class="ds-input" id="f-title" placeholder="DAIICHI DIVE" /></label>
          <label class="field"><span>URL</span><input class="ds-input" id="f-url" placeholder="https://…" /></label>
        </div>
        <label class="field"><span>何が良いか</span><textarea class="ds-input" id="f-good" placeholder="1アクセント・ガラスカード・環境アニメ…"></textarea></label>
        <label class="field"><span>抽出したい token / パターン</span><textarea class="ds-input" id="f-extract" placeholder="glassmorphism, グラデ見出し, prefers-reduced-motion"></textarea></label>
        <div class="grid grid-2">
          <label class="field"><span>タグ (カンマ区切り)</span><input class="ds-input" id="f-tags" placeholder="dark, glass, motion" /></label>
          <label class="field"><span>ステータス</span>
            <select class="ds-input" id="f-status"><option value="inbox">inbox</option><option value="promoted">promoted</option></select>
          </label>
        </div>
        <div class="row" style="margin:var(--space-2) 0 var(--space-4)">
          <button class="ds-btn ds-btn-accent" id="f-gen">JSON を生成</button>
          <button class="ds-btn" id="f-copy" hidden>コピー</button>
        </div>
        <pre class="snippet" id="f-out" hidden></pre>
      </div>
    </details>
  </div>

  <script src="./app.js"></script>
  <script>
    const grid = document.getElementById('ref-grid');
    const emptyEl = document.getElementById('empty');
    const statusSeg = document.getElementById('status-seg');
    const tagFilter = document.getElementById('tag-filter');
    let DATA = [];
    let activeStatus = 'all';
    let activeTag = null;

    function esc(s) { return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    function initials(title) {
      const t = (title || '?').trim();
      return t.length <= 3 ? t : t.slice(0, 2).toUpperCase();
    }

    function cardHTML(r) {
      const tags = (r.tags || []).map(t => `<span class="ds-badge">${esc(t)}</span>`).join('');
      const statusBadge = r.status === 'promoted'
        ? '<span class="ds-badge ds-badge-success">promoted</span>'
        : '<span class="ds-badge">inbox</span>';
      const autoBadge = r.auto ? '<span class="ds-badge" title="自動収集">🤖 auto</span>' : '';
      const thumb = r.shot
        ? `<img src="${esc(r.shot)}" alt="${esc(r.title)} のスクリーンショット" loading="lazy" />`
        : `<span class="mono">${esc(initials(r.title))}</span>`;
      const titleEl = r.url
        ? `<a class="ref-title" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a>`
        : `<span class="ref-title">${esc(r.title)}</span>`;
      const extract = r.extract
        ? `<div class="ref-extract">抽出: ${esc(r.extract)}</div>` : '';
      return `<article class="ds-card ref-card">
        <div class="ref-thumb">${thumb}</div>
        <div class="ref-body">
          <div class="ref-head">${titleEl}<span class="row" style="gap:4px">${autoBadge}${statusBadge}</span></div>
          ${r.whatsGood ? `<p class="ref-good">${esc(r.whatsGood)}</p>` : ''}
          ${extract}
          <div class="ref-tags">${tags}</div>
          <div class="ref-foot"><span>${esc(r.source || '')}</span><span>${esc(r.date || '')}</span></div>
          ${r.reflected ? '' : `<div class="row" style="gap:var(--space-2);padding-top:var(--space-2)"><button class="ds-btn" data-promote="${esc(r.id)}" style="font-size:var(--text-xs);padding:.35rem .8rem">還元案を作る</button></div>`}
        </div>
      </article>`;
    }

    function render() {
      const list = DATA.filter(r =>
        (activeStatus === 'all' || r.status === activeStatus) &&
        (!activeTag || (r.tags || []).includes(activeTag)));
      grid.innerHTML = list.map(cardHTML).join('');
      emptyEl.hidden = list.length > 0;
    }

    function buildTagFilter() {
      const tags = [...new Set(DATA.flatMap(r => r.tags || []))].sort();
      tagFilter.innerHTML = tags.map(t =>
        `<button data-tag="${esc(t)}" aria-pressed="false">#${esc(t)}</button>`).join('');
      tagFilter.addEventListener('click', e => {
        const btn = e.target.closest('button'); if (!btn) return;
        const t = btn.dataset.tag;
        activeTag = (activeTag === t) ? null : t;
        [...tagFilter.children].forEach(b => b.setAttribute('aria-pressed', b.dataset.tag === activeTag));
        render();
      });
    }

    statusSeg.addEventListener('click', e => {
      const btn = e.target.closest('button'); if (!btn) return;
      activeStatus = btn.dataset.status;
      [...statusSeg.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
      render();
    });

    // 「還元案を作る」: ローカルの promote_design.py を呼ぶコマンドをコピー
    // (ブラウザは tokens.css を書けないため、1コマンド実行に橋渡し)
    grid.addEventListener('click', e => {
      const btn = e.target.closest('button[data-promote]'); if (!btn) return;
      const id = btn.dataset.promote;
      const cmd = `cd ~/design-system && python3 tools/promote_design.py ${id}`;
      navigator.clipboard.writeText(cmd).catch(() => {});
      btn.textContent = 'コマンドをコピー✓';
      setTimeout(() => btn.textContent = '還元案を作る', 1800);
    });

    fetch('./data/references.json')
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(d => { DATA = d.references || []; buildTagFilter(); render(); })
      .catch(err => {
        grid.innerHTML = '';
        emptyEl.hidden = false;
        emptyEl.textContent = 'references.json を読み込めませんでした (' + err.message +
          ')。http サーバ経由で開いていますか? 例: python3 -m http.server';
      });

    // --- 追加フォーム: JSON 雛形生成 -----------------------------------
    const out = document.getElementById('f-out');
    const copyBtn = document.getElementById('f-copy');
    function slugify(s) {
      return (s || '').toLowerCase().trim()
        .replace(/[^\w\s-]/g, '').replace(/\s+/g, '-').slice(0, 40) || 'ref';
    }
    document.getElementById('f-gen').addEventListener('click', () => {
      const title = document.getElementById('f-title').value;
      const tags = document.getElementById('f-tags').value
        .split(',').map(s => s.trim()).filter(Boolean);
      const entry = {
        id: slugify(title),
        title: title,
        url: document.getElementById('f-url').value.trim(),
        shot: '',
        whatsGood: document.getElementById('f-good').value.trim(),
        extract: document.getElementById('f-extract').value.trim(),
        tags: tags,
        status: document.getElementById('f-status').value,
        date: new Date().toISOString().slice(0, 10)
      };
      out.textContent = JSON.stringify(entry, null, 2) + ',';
      out.hidden = false;
      copyBtn.hidden = false;
    });
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(out.textContent).then(() => {
        copyBtn.textContent = 'コピーしました ✓';
        setTimeout(() => copyBtn.textContent = 'コピー', 1500);
      });
    });
  </script>
</body>
</html>
