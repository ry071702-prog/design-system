app:
  description: 収集したデザインの良いパターンを、現行 tokens.css に整合する「追記専用のトークン提案」へ還元する。
  icon: "\U0001F331"
  icon_background: '#EFF1F5'
  mode: workflow
  name: デザイン還元キュレーター
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig: {}
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
    - id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      width: 244
      height: 160
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 開始
        desc: ''
        variables:
        - variable: title
          label: デザイン名
          type: text-input
          required: true
          max_length: 200
          options: []
        - variable: whatsGood
          label: 良い点
          type: paragraph
          required: false
          options: []
        - variable: extract
          label: 抽出候補パターン
          type: paragraph
          required: false
          options: []
        - variable: tags
          label: タグ
          type: text-input
          required: false
          max_length: 200
          options: []
        - variable: tokens
          label: 現行 tokens.css 全文
          type: paragraph
          required: true
          options: []
    - id: llm
      type: custom
      position:
        x: 384
        y: 282
      positionAbsolute:
        x: 384
        y: 282
      width: 244
      height: 98
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 還元提案 (Claude Sonnet)
        desc: ''
        model:
          provider: langgenius/anthropic/anthropic
          name: claude-sonnet-4-6
          mode: chat
          completion_params:
            temperature: 0.3
        prompt_template:
        - id: system-prompt
          role: system
          text: |
            あなたは共通デザインシステムのキュレーターです。収集した1件のデザインの良いパターンを、現行 tokens.css に「還元」する具体案を作ります。tokens.css は3プロジェクト共通の単一の源(聖域)であり、品質を崩さないことが最優先です。

            # 鉄則
            - **追記専用**を原則とする。`additive_css` には「新しい custom property」や「新しい .ds- レシピ」など、既存定義を壊さない追加だけを書く。既存の --変数 を :root で再定義しない。
            - 既存値の変更が妥当な場合は実施せず、`value_changes` に「どの変数を何に、なぜ」を文章で書くだけにする(適用は人が手動判断)。
            - 既存の命名規則・スケール・4原則(1アクセント / たっぷり余白 / やわらかい奥行き / 繊細な動き)に整合させる。突飛な値や色は足さない。
            - 既に tokens.css にある概念は重複追加しない。本当に不足している場合のみ提案する。足すべきものが無ければ additive_css は空文字にし、summary にその旨を書く。
            - `additive_css` のコメントで、何のためのトークンかを日本語で1行添える。

            # 出力 (JSON のみ。前後に文章やコードフェンスを付けない)
            {
              "summary": "何を還元するかを1〜2文",
              "target": "追記先の意図 (例: ルートに新トークン追加 / .ds-glass 拡張 / theme-editorial 専用)",
              "additive_css": "追記専用CSS文字列(既存を壊さない)。無ければ空文字",
              "value_changes": "既存値の調整提案があれば文章で。無ければ空文字",
              "rationale": "なぜ取り込むか・どの観点(配色/タイポ/余白/奥行き/モーション)",
              "risk": "low / medium / high",
              "log_line": "references.md の採用済みに残す1行 (取り込んだ内容→反映先)"
            }
        - id: user-prompt
          role: user
          text: |
            ## 収集したデザイン
            名前: {{#start.title#}}
            良い点: {{#start.whatsGood#}}
            抽出候補: {{#start.extract#}}
            タグ: {{#start.tags#}}

            ## 現行 tokens.css (この構造・命名に整合させること)
            {{#start.tokens#}}
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: end
      type: custom
      position:
        x: 688
        y: 282
      positionAbsolute:
        x: 688
        y: 282
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 終了
        desc: ''
        outputs:
        - variable: result
          value_selector:
          - llm
          - text
    viewport:
      x: 0
      y: 0
      zoom: 1
