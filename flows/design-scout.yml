app:
  description: 収集したデザイン事例(タイトル/カテゴリ/出典)から、注目観点・抽出したいトークン・タグを JSON で返す。
  icon: "\U0001F50E"
  icon_background: '#EFF1F5'
  mode: workflow
  name: デザイン収集スカウト
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.1.5
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig: {}
      image:
        enabled: false
        number_limits: 3
        transfer_methods: []
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - id: start-llm
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: start
        targetType: llm
        isInIteration: false
    - id: llm-end
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
      data:
        sourceType: llm
        targetType: end
        isInIteration: false
    nodes:
    - id: start
      type: custom
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      width: 244
      height: 140
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: start
        title: 開始
        desc: ''
        variables:
        - variable: title
          label: デザイン事例のタイトル
          type: text-input
          required: true
          max_length: 200
          options: []
        - variable: source
          label: 出典 (ギャラリー名)
          type: text-input
          required: false
          max_length: 80
          options: []
        - variable: categories
          label: カテゴリ・補足
          type: paragraph
          required: false
          options: []
    - id: llm
      type: custom
      position:
        x: 384
        y: 282
      positionAbsolute:
        x: 384
        y: 282
      width: 244
      height: 98
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: llm
        title: 抽出 (Claude Sonnet)
        desc: ''
        model:
          provider: langgenius/anthropic/anthropic
          name: claude-sonnet-4-6
          mode: chat
          completion_params:
            temperature: 0.4
        prompt_template:
        - id: system-prompt
          role: system
          text: |
            あなたはデザイン収集アシスタントです。収集したデザイン事例について、人間が後で「自分のデザインシステムに取り込むか」を素早く判断できる短いメモを作ります。

            # 重要な前提
            - あなたは実物のサイトを見ていません。タイトル・カテゴリ・出典(ギャラリー)から推測します。断定せず「見るべき観点」を示すスタンスで書く。
            - 観点の軸は: 配色 / タイポ / 余白とリズム / 奥行き(影・ガラス) / モーション / レイアウト。

            # 出力 (JSON のみ。前後に文章やコードフェンスを付けない)
            {
              "whatsGood": "このデザインで特に見ておくとよい観点を1〜2文 (推測ベースで穏当に)",
              "extract": "自分のtokens.cssへ取り込めそうなパターン候補をカンマ区切りで3〜6個",
              "tags": ["英小文字の短いタグを2〜5個 (例 dark, glass, minimal, motion, typography, editorial)"]
            }
        - id: user-prompt
          role: user
          text: |
            タイトル: {{#start.title#}}
            出典: {{#start.source#}}
            カテゴリ・補足: {{#start.categories#}}
        context:
          enabled: false
          variable_selector: []
        vision:
          enabled: false
    - id: end
      type: custom
      position:
        x: 688
        y: 282
      positionAbsolute:
        x: 688
        y: 282
      width: 244
      height: 90
      selected: false
      sourcePosition: right
      targetPosition: left
      data:
        type: end
        title: 終了
        desc: ''
        outputs:
        - variable: result
          value_selector:
          - llm
          - text
    viewport:
      x: 0
      y: 0
      zoom: 1
